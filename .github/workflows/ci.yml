name: CI

on: [push, pull_request]

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.13"
          enable-cache: true
      # --locked fails if uv.lock no longer matches pyproject.toml.
      - run: uv sync --locked
      # requirements.txt is exported from the lock for the Docker build; a
      # hand edit there, or a lock change without re-exporting, fails here.
      - run: uv export --locked --no-dev --no-hashes --format requirements-txt --no-header | diff -u requirements.txt -
      - run: uv run ruff check .
      - run: uv run mypy app
      - run: uv run pytest --cov=app --cov-report=term-missing tests/
        env:
          # Tests never call the model API; an empty key proves it.
          NVIDIA_API_KEY: ""

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm run lint
      - run: npm run build

  design-rules:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # No gradients, small radii, two shadows, tokens over hex literals.
      - run: ./scripts/check-design-rules.sh
