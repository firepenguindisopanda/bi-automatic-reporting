# Eval cases. One per fixture in evals/fixtures/.
#
# Expectations are deliberately loose. The point is not to pin the model to one
# phrasing - that would fail on every prompt tweak - but to catch the failures
# that actually matter: getting the company wrong, inventing competitors,
# leaving fields empty, or emitting placeholder text.
#
# Fields:
#   must_mention   substrings expected somewhere in the profile (case-insensitive,
#                  any one of a group satisfies that group)
#   industry_terms at least one must appear in the extracted industry
#   forbidden      strings that indicate a hallucination or a wrong subject, in
#                  any stage
#   min_offerings  the site clearly lists at least this many products/services
#   assertions     checks on any stage's output, see below
#   notes          why this fixture is in the set
#
# An `assertions` entry targets one or more stages and, optionally, a dotted
# field path (lists are walked element-wise: `key_players.name`). It reads every
# string value under that path - never the field names - so it holds whatever
# shape the stage's output model takes. Matching is case-insensitive.
#
#   - stage: market               # or `stages: [profile, marketing]`
#     path: pricing_strategy      # optional
#     forbid: [...]               # none of these literals may appear
#     forbid_regex: [...]         # none of these patterns may match
#     require_any: [...]          # at least one of these literals...
#     require_any_regex: [...]    # ...or patterns must appear
#
# Each hit costs 15 points on that stage, like any failed assertion. Give every
# entry a comment saying why it exists, and keep false positives low: an
# assertion that fires on a correct answer teaches people to ignore it. Stage
# and regex typos are rejected when the file loads, before anything is paid for.

cases:
  - name: stripe
    fixture: stripe.html
    url: https://stripe.com
    company: Stripe
    must_mention: [["payment", "financial", "money"]]
    industry_terms: [payment, fintech, financial, infrastructure, saas]
    forbidden: [Shopify Inc., Acme Corp]
    min_offerings: 3
    notes: Dense marketing site with a broad product range - tests offering extraction.

  - name: ghost
    fixture: ghost.html
    url: https://ghost.org
    company: Ghost
    must_mention: [["publish", "newsletter", "blog", "creator"]]
    industry_terms: [publishing, cms, newsletter, media, saas, content]
    forbidden: [Acme Corp]
    min_offerings: 2
    notes: Open-source product with a commercial hosted tier - tests business-model reading.

  - name: eleventy
    fixture: eleventy.html
    url: https://www.11ty.dev
    company: Eleventy
    must_mention: [["static site", "generator", "javascript", "site"]]
    industry_terms: [developer, software, web, tooling, open source, static]
    forbidden: [Acme Corp]
    min_offerings: 1
    assertions:
      # No invented prices. The saved page quotes no amount anywhere - its only
      # money talk is "Late Pricing Available" on the Build Awesome Kickstarter -
      # so a currency figure in these stages was made up. Market-size figures
      # (an amount followed by M/B/bn/million/billion, or opening a range such
      # as "$10-12 B") are skipped: the report restates the market stage's TAM,
      # which is an estimate, not a price. "$0" is skipped too: free is correct.
      - stages: [profile, marketing, report]
        forbid_regex:
          - '[$€£]\s?(?:[1-9]|0[.,]0*[1-9])[\d,.]*(?![\d,.])(?!\s?(?:[-–\u2014‑]|to)\s?[$€£]?\s?\d)(?!\s?(?:m|mn|mm|b|bn|million|billion|trillion)\b)'
      # The pricing strategy has to say how a free, open-source project is
      # actually funded. A tiered or value-based SaaS story is the invention
      # this case exists to catch. "\bfree" also accepts "freemium" on purpose:
      # the page does advertise a paid Build Awesome Pro.
      - stage: market
        path: pricing_strategy
        require_any_regex:
          - '\bfree'
          - 'open[- ]?source'
          - 'no[- ]cost'
          - 'no charge'
          - 'donat'
          - 'sponsor'
          - 'open collective'
          - 'kickstarter'
          - 'crowdfund'
          - 'backer'
    notes: A free open-source tool. The saved page (2026-07) mentions a Kickstarter
           for Build Awesome Pro but quotes no prices, so no stage should invent a
           price or a subscription business.

  - name: linear
    fixture: linear.html
    url: https://linear.app
    company: Linear
    must_mention: [["product development", "issue", "project", "software team"]]
    industry_terms: [saas, project management, software, productivity, developer]
    forbidden: [Acme Corp]
    min_offerings: 2
    notes: Heavy JS site; most copy is in the markup. Tests extraction from a
           script-heavy page.

  - name: basecamp
    fixture: basecamp.html
    url: https://basecamp.com
    company: Basecamp
    must_mention: [["project management", "team", "work", "collaborat"]]
    industry_terms: [saas, project management, software, collaboration, productivity]
    forbidden: [Acme Corp]
    min_offerings: 1
    notes: Short, opinionated copy - tests behaviour when there is little text.

  - name: flyio
    fixture: flyio.html
    url: https://fly.io
    company: Fly
    must_mention: [["deploy", "app", "server", "cloud", "compute"]]
    industry_terms: [cloud, infrastructure, hosting, developer, paas, compute]
    forbidden: [Acme Corp]
    min_offerings: 1
    notes: Developer infrastructure with jargon-heavy copy.

  - name: govuk
    fixture: govuk.html
    url: https://www.gov.uk
    company: GOV.UK
    must_mention: [["government", "public service", "uk"]]
    industry_terms: [government, public sector, public service, information]
    # "competitor" is not usable as a canary here - a competitive analysis is
    # entitled to use the word, including to say there are none. These are
    # commercial rivals that gov.uk could not plausibly have.
    forbidden: [Acme Corp, Salesforce, Shopify, Stripe Inc]
    min_offerings: 1
    assertions:
      # The canary proper: the industry must say what GOV.UK is. industry_terms
      # above also accepts "information", which "Information Technology"
      # satisfies, so it cannot tell a government portal from a software vendor;
      # and must_mention accepts "uk", which the company name alone satisfies.
      - stage: profile
        path: industry
        require_any_regex: ['government', 'public[- ]sector', 'public[- ]service', 'public administration', 'civic']
      # Commercial inventions: the page sells nothing and has no plans, tiers or
      # trials. Bare "per month" and "subscription" are deliberately not here:
      # Universal Credit is paid monthly and GOV.UK offers email subscriptions,
      # so both can appear in a correct answer. Not applied to `report`, which
      # restates the market stage's pricing_strategy - a prompt that asks for
      # "freemium, tiered, value-based" and so forces commercial words on it.
      - stages: [profile, marketing]
        forbid_regex:
          - 'pricing (?:tier|plan)s?'
          - 'premium (?:plan|tier|subscription|version|membership)s?'
          - 'free trials?'
          - '\bfreemium\b'
          - '(?:paid|monthly|annual) (?:plan|tier|subscription)s?'
          - 'subscription (?:plan|tier|fee|price|pricing)s?'
    notes: Not a business at all. Market sizing and competitors here should be
           hedged rather than confidently invented - the hallucination canary.

  # --- Small and mid-sized businesses (2026-10) ------------------------------
  # The seven cases above are all developer tools or big platforms. These are
  # the kind of site this app is actually pointed at: local firms, a nonprofit,
  # a manufacturer, food, direct-to-consumer retail, several in Trinidad and
  # Tobago. Pages saved 2026-10-10 with scripts, styles, comments and inline
  # images stripped; extraction was checked identical to the live page.

  - name: valcrest
    fixture: valcrest.html
    url: https://valcresthq.com/
    company: Valcrest
    must_mention: [["payroll"], ["trinidad", "tobago", "t&t"]]
    industry_terms: [payroll, software, hr, accounting, saas]
    forbidden: [Acme Corp]
    min_offerings: 2
    assertions:
      # The product runs on the customer's own computer ("Nothing uploaded
      # anywhere"). Calling Valcrest itself cloud-based is the commonest wrong
      # guess for payroll software. Profile only: rivals may well be cloud-based.
      - stage: profile
        forbid_regex: ['\bcloud[- ]based\b', '\bsaas platform\b']
      # The page states a one-time fee in TTD; the pricing strategy has to say so.
      - stage: market
        path: pricing_strategy
        require_any_regex: ['one[- ]time', '\bttd\b', 'perpetual', 'licen[cs]e fee']
    notes: Local B2B software with a stated one-time TTD price and an on-premise
           model - tests grounding against the obvious SaaS assumption.

  - name: riomed
    fixture: riomed.html
    url: https://www.riomed.com/cellmaflex/
    must_mention: [["cellmaflex"], ["patient", "clinic", "health"]]
    industry_terms: [health, medical, clinic, hospital, software, technology]
    forbidden: [Acme Corp]
    min_offerings: 3
    notes: The page is mostly a long product menu (care settings, solution
           modules). In production this run returned a SWOT with only
           strengths - tests whether a menu-heavy page still yields a full
           analysis.

  - name: asawright
    fixture: asawright.html
    url: https://asawright.org/
    company: Asa Wright
    must_mention: [["non-profit", "nonprofit", "land trust", "conservation"]]
    industry_terms: [conservation, nature, nonprofit, non-profit, tourism, eco, environment, land trust]
    forbidden: [Acme Corp, Salesforce, Shopify]
    min_offerings: 1
    assertions:
      # A nonprofit land trust with almost no copy. Software-business vocabulary
      # here is invention, the same canary as govuk.
      - stages: [profile, marketing]
        forbid_regex:
          - 'pricing (?:tier|plan)s?'
          - 'free trials?'
          - '\bfreemium\b'
          - '\bsaas\b'
          - 'subscription (?:plan|tier|fee|price|pricing)s?'
    notes: Thin page (about 1,400 characters, mostly news items) for a
           nonprofit - tests behaviour when starved of input and not a business.

  - name: angostura
    fixture: angostura.html
    url: https://www.angostura.com/
    company: Angostura
    must_mention: [["bitters"], ["rum"]]
    industry_terms: [beverage, spirits, rum, bitters, drinks, alcohol, food, consumer]
    forbidden: [Acme Corp]
    min_offerings: 2
    notes: Most of the extracted text is an age gate's day, month and year
           dropdowns. Tests reading a real business through heavy noise.

  - name: tormach
    fixture: tormach.html
    url: https://tormach.com/
    company: Tormach
    must_mention: [["cnc"]]
    industry_terms: [cnc, machine, machinery, manufacturing, industrial, tools, equipment]
    forbidden: [Acme Corp]
    min_offerings: 3
    notes: Small manufacturer selling machines, tooling and training online -
           B2B hardware rather than software.

  - name: pilot
    fixture: pilot.html
    url: https://pilot.com/
    company: Pilot
    must_mention: [["bookkeeping"], ["startup", "small business"]]
    industry_terms: [accounting, bookkeeping, finance, financial, tax, professional services]
    forbidden: [Acme Corp]
    min_offerings: 3
    notes: Professional services sold like software ("50/50 people and
           software") - tests reading a hybrid business model.

  - name: tartine
    fixture: tartine.html
    url: https://tartinebakery.com/
    company: Tartine
    must_mention: [["bakery", "bread", "cake", "pastr", "food"]]
    industry_terms: [bakery, food, restaurant, cafe, hospitality, baked goods]
    forbidden: [Acme Corp]
    min_offerings: 1
    assertions:
      # A bakery chain. Software pricing language is a wrong-subject failure.
      - stages: [profile, marketing]
        forbid_regex: ['\bsaas\b', 'free trials?', '\bfreemium\b', 'subscription (?:plan|tier)s?']
    notes: Local food business with locations in three regions and shipping
           through a partner - short copy, mostly navigation.

  - name: harvestright
    fixture: harvestright.html
    url: https://harvestright.com/
    company: Harvest Right
    must_mention: [["freeze dr"]]
    industry_terms: [appliance, freeze, food, preservation, consumer, home, kitchen, durable]
    forbidden: [Acme Corp]
    min_offerings: 1
    notes: Direct-to-consumer appliance maker; the page is a storefront with a
           sale banner and a giveaway.

  - name: allbirds
    fixture: allbirds.html
    url: https://www.allbirds.com/
    company: Allbirds
    must_mention: [["shoe", "footwear", "sneaker"]]
    industry_terms: [footwear, apparel, shoes, fashion, retail, clothing, e-commerce, consumer]
    forbidden: [Acme Corp]
    min_offerings: 2
    assertions:
      # The brand's whole position is its materials, stated in the meta
      # description; a profile that misses them has not read the page.
      - stage: profile
        require_any: [merino, eucalyptus, natural material, sustainab]
    notes: E-commerce storefront whose text is mostly product tiles and cart
           furniture - 56 headings, 1,500 characters.
