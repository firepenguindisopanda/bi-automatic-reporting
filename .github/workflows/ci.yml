name: CI

on: [push, pull_request]

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.13"
          enable-cache: true
      # --locked fails if uv.lock no longer matches pyproject.toml.
      - run: uv sync --locked
      # requirements.txt is exported from the lock for the Docker build; a
      # hand edit there, or a lock change without re-exporting, fails here.
      - run: uv export --locked --no-dev --no-hashes --format requirements-txt --no-header | diff -u requirements.txt -
      - run: uv run ruff check .
      - run: uv run mypy app
      - run: uv run pytest --cov=app --cov-report=term-missing tests/
        env:
          # Tests never call the model API; an empty key proves it.
          NVIDIA_API_KEY: ""

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      # tsconfig.json is solution-style (files: []), so `tsc --noEmit` checks
      # nothing; build mode type-checks the app, tests, configs and e2e specs.
      - run: npx tsc -b
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-results
          path: frontend/test-results/
          retention-days: 7

  design-rules:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # No gradients, radii 4-6px, two shadows, tokens over colour literals.
      - run: ./scripts/check-design-rules.sh
      # Proves every rule still catches what it bans, against temp fixtures.
      - run: ./scripts/check-design-rules.sh --self-test
