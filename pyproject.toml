[project]
name = "business-intelligence"
version = "0.1.0"
description = "Automated business intelligence system - scrape, analyze, report."
requires-python = ">=3.13"
# The single source of truth for dependencies. uv.lock pins them, and
# requirements.txt is exported from the lock for pip-based installs (the
# Dockerfile) - edit here, then run `uv lock` and the export in README.md.
dependencies = [
    "asyncpg>=0.29.0",
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic>=2.0.0",
    # EmailStr: the submit endpoint validates the recipient as an address.
    "email-validator>=2.0",
    "pydantic-settings>=2.0.0",
    "langchain-nvidia-ai-endpoints>=0.3.0",
    "langchain-core>=0.3.0",
    "python-dotenv>=1.0.0",
    "httpx>=0.27.0",
    "beautifulsoup4>=4.12.0",
    # Held below 6: lxml stopped publishing s390x wheels in 6.x, and the
    # LinuxONE deploy target needs one. See SPEC.md section 4.
    "lxml>=5.0.0,<6",
    "jinja2>=3.1.0",
    "pyyaml>=6.0",
    # >=70 for the URLFetcher class the report renderer subclasses to refuse fetches.
    "weasyprint>=70.0",
    "python-docx>=1.1.0",
    "aiosmtplib>=3.0.0",
    "aiosqlite>=0.20.0",
]

[project.optional-dependencies]
sendgrid = ["sendgrid>=6.0"]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.5.0",
    "mypy>=1.10.0",
]

[tool.uv]
# The project is an application, not a library: nothing to build or install.
package = false

[tool.ruff]
line-length = 120
target-version = "py313"
# extend-, not exclude: `exclude` replaces ruff's defaults, so a `.venv` in the
# checkout (which `uv sync` creates in CI) would be linted too.
extend-exclude = ["tests/", ".claude/"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]

[tool.mypy]
strict = true
python_version = "3.13"
ignore_missing_imports = true
exclude = ["tests/", ".venv/"]

[[tool.mypy.overrides]]
module = "app.scraper.engine"
# BeautifulSoup returns dynamic types - AttributeValueList is runtime-only
ignore_errors = true

[[tool.mypy.overrides]]
module = "app.report.generator"
# python-docx uses runtime dynamic attributes (font, italic)
ignore_errors = true

[[tool.mypy.overrides]]
module = "app.llm.client"
# langchain_nvidia_ai_endpoints returns untyped Dict/Any
ignore_errors = true

[tool.pytest.ini_options]
markers = ["real_jobs: test drives the real job queue"]
testpaths = ["tests"]
asyncio_mode = "auto"
pythonpath = ["."]

[tool.coverage.run]
source = ["app"]
omit = ["tests/*"]

[tool.coverage.report]
fail_under = 50
show_missing = true
