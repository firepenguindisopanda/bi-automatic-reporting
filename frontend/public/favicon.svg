<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <!-- A page with one line marked in rust: the report, and the stage being
       worked on. Flat fills only - no gradients, no blur - so it stays crisp
       at 16px and matches the editorial palette. -->
  <style>
    .page { fill: #1a1815; }
    .rule { fill: #fbfaf7; }
    .mark { fill: #9a3f1f; }
    @media (prefers-color-scheme: dark) {
      .page { fill: #f2efe8; }
      .rule { fill: #14130f; }
      .mark { fill: #c25a30; }
    }
  </style>
  <rect class="page" x="5" y="2" width="22" height="28" rx="2" />
  <rect class="mark" x="9" y="7" width="14" height="3" rx="1" />
  <rect class="rule" x="9" y="14" width="14" height="2" rx="1" />
  <rect class="rule" x="9" y="19" width="14" height="2" rx="1" />
  <rect class="rule" x="9" y="24" width="9" height="2" rx="1" />
</svg>
